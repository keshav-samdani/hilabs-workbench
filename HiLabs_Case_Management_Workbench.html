<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HiLabs Case Management Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#F6F7F5;--card:#FFFFFF;--card2:#F0F3F1;--sidebar-bg:#2C3339;--sidebar-hover:#3A4249;--sidebar-active:#445059;--sidebar-text:rgba(255,255,255,.6);--sidebar-text-active:#fff;
--text:#27343C;--text2:#64717A;--text3:#8C959D;--border:#E3E8E5;--border2:#EEF1EE;
--teal:#397D76;--teal-bg:#EDF5F4;--teal-dark:#2E6660;
--hilabs-blue:#2563EB;--hilabs-blue-light:#EFF4FF;--hilabs-blue-subtle:rgba(37,99,235,.08);
--blue-gray:#71899A;--blue-gray-bg:#EEF2F5;
--green:#47836A;--green-bg:#EDF7F2;--amber:#B88743;--amber-bg:#FDF6EC;--red:#B85F57;--red-bg:#FDF0EF;
--radius:6px;--shadow:0 1px 3px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;overflow:hidden;height:100vh}
#app{display:flex;height:100vh}

/* Sidebar */
.sidebar{width:230px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;height:100vh;flex-shrink:0}
.sb-logo{padding:18px 16px 10px;display:flex;align-items:center;gap:6px}
.sb-logo svg{flex-shrink:0}
.sb-logo-text{font-size:17px;color:#fff;letter-spacing:-.3px;font-weight:500}
.sb-logo-text b{font-weight:700;color:var(--hilabs-blue);filter:brightness(1.35)}
.sb-search{padding:0 12px 10px}
.sb-search input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);padding:7px 10px 7px 30px;color:#fff;font-size:12px;outline:none}
.sb-search input::placeholder{color:rgba(255,255,255,.35)}
.sb-search{position:relative}
.sb-search .ic{position:absolute;left:22px;top:8px;color:rgba(255,255,255,.35)}
.sb-section{flex:1;overflow-y:auto;padding:4px 8px}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;font-size:12.5px;color:var(--sidebar-text);transition:all .15s;position:relative}
.sb-item:hover{background:var(--sidebar-hover);color:rgba(255,255,255,.85)}
.sb-item.active{background:var(--sidebar-active);color:#fff;font-weight:500}
.sb-item.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--hilabs-blue);border-radius:0 2px 2px 0}
.sb-item .badge{margin-left:auto;background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);font-size:10px;padding:1px 6px;border-radius:10px;font-weight:500}
.sb-bottom{padding:8px;border-top:1px solid rgba(255,255,255,.08)}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px;margin-top:4px}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;filter:brightness(1.3)}
.sb-user-name{color:#fff;font-size:12.5px;font-weight:500}
.sb-user-role{color:rgba(255,255,255,.4);font-size:11px}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:0 24px;height:52px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-logo{display:flex;align-items:center;gap:5px;flex-shrink:0}
.topbar-logo-text{font-size:15px;font-weight:600;letter-spacing:-.3px;color:var(--text)}
.topbar-logo-text b{font-weight:700;color:var(--hilabs-blue)}
.topbar-divider{width:1px;height:24px;background:var(--border);margin:0 4px}
.topbar-title{font-size:15px;font-weight:600;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:14px}
.topbar-badge{font-size:11px;color:var(--text3);background:var(--card2);padding:3px 10px;border-radius:12px;display:flex;align-items:center;gap:4px}
.topbar-date{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:5px}
.topbar-btn{position:relative;cursor:pointer;color:var(--text2);padding:4px}
.notif-dot{position:absolute;top:2px;right:2px;width:7px;height:7px;background:var(--red);border-radius:50%}
.content{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}

/* Typography */
.page-header{margin-bottom:20px}
.page-header h1{font-size:20px;font-weight:600;color:var(--text);margin-bottom:2px}
.page-header p{font-size:12.5px;color:var(--text3)}
.section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin:14px 0 6px;padding-top:8px}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* Grids */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-23{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.grid-32{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px;white-space:nowrap}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-teal{background:var(--teal-bg);color:var(--teal)}
.badge-blue{background:var(--blue-gray-bg);color:var(--blue-gray)}
.badge-gray{background:#F2F3F2;color:#6B7280}
.badge-purple{background:#F3F0FF;color:#7A5CE0}
.badge-cyan{background:var(--teal-bg);color:var(--teal)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--radius);font-size:12.5px;font-weight:500;border:none;cursor:pointer;transition:all .15s;font-family:inherit}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-dark)}
.btn-outline{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{background:var(--card2);border-color:var(--text3)}
.btn-ghost{background:transparent;color:var(--text2);padding:5px 8px}
.btn-ghost:hover{color:var(--text);background:var(--card2)}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:4px 10px;font-size:11.5px}

/* Tabs */
.tab-bar{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:8px 14px;font-size:12px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--hilabs-blue);border-bottom-color:var(--hilabs-blue)}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid var(--border2);vertical-align:top}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--card2)}
.table-wrap{overflow-x:auto}

/* Forms */
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:11.5px;font-weight:600;color:var(--text2);margin-bottom:4px}
.form-input,.form-select,.form-textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:12.5px;font-family:inherit;color:var(--text);background:var(--card);outline:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--hilabs-blue);box-shadow:0 0 0 2px var(--hilabs-blue-light)}
.form-textarea{min-height:72px;resize:vertical}

/* Data rows */
.data-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border2);font-size:12.5px}
.data-row:last-child{border-bottom:none}

/* Queue row */
.queue-row{display:grid;grid-template-columns:40px 1.5fr 1.2fr .8fr 1fr .5fr .5fr 30px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border2);cursor:pointer;font-size:12.5px}
.queue-row:hover{background:var(--card2)}
.queue-header{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;cursor:default;border-bottom:1px solid var(--border)}
.queue-header:hover{background:transparent}

/* Filter bar */
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.filter-bar input,.filter-bar select{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;font-family:inherit;background:var(--card);color:var(--text)}
.filter-bar input{flex:1;max-width:320px}

/* Priority & ranks */
.priority-score{font-weight:700;font-size:14px;color:var(--teal)}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:600}
.rank-1{background:var(--red-bg);color:var(--red)}
.rank-2{background:var(--amber-bg);color:var(--amber)}
.rank-3{background:var(--teal-bg);color:var(--teal)}
.rank-default{background:var(--card2);color:var(--text3)}

/* Stat row */
.stat-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.stat-mini{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.stat-mini b{display:block;font-size:22px;color:var(--text);font-weight:700}
.stat-mini span{font-size:11px;color:var(--text3)}

/* Stat cards */
.stat-card{text-align:center;padding:20px}
.stat-num{font-size:28px;font-weight:700;color:var(--teal)}
.stat-label{font-size:11.5px;color:var(--text3);margin-top:2px}

/* Member header */
.member-header{display:flex;gap:16px;align-items:flex-start;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;box-shadow:var(--shadow)}
.member-avatar{width:48px;height:48px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
.member-info{flex:1}
.member-name{font-size:17px;font-weight:600;color:var(--text)}
.member-meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px;font-size:12px;color:var(--text3)}
.member-meta span{display:flex;align-items:center;gap:3px}
.member-actions{display:flex;gap:6px;flex-shrink:0}

/* Lifecycle */
.lifecycle-track{display:flex;gap:0;margin:10px 0}
.lc-step{flex:1;text-align:center;position:relative;padding-top:20px}
.lc-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:var(--card);position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:1}
.lc-step.done .lc-dot{background:var(--green);border-color:var(--green)}
.lc-step.current .lc-dot{background:var(--teal);border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-bg)}
.lc-step::after{content:'';position:absolute;top:6px;left:50%;right:-50%;height:2px;background:var(--border)}
.lc-step:last-child::after{display:none}
.lc-step.done::after{background:var(--green)}
.lc-step-label{font-size:10px;color:var(--text3);margin-top:4px}
.lc-step.current .lc-step-label{color:var(--teal);font-weight:600}
.lc-step.done .lc-step-label{color:var(--green)}

/* Score bar */
.score-bar{display:flex;border-radius:4px;overflow:hidden;background:var(--border2)}
.score-bar i{display:block;height:100%}

/* Dots */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.dot-green{background:var(--green)}
.dot-amber{background:var(--amber)}
.dot-red{background:var(--red)}

/* Source tag */
.source-tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--text3);background:var(--card2);padding:1px 6px;border-radius:3px}

/* Flag box */
.flag-box{background:var(--red-bg);border:1px solid rgba(184,95,87,.15);border-radius:var(--radius);padding:8px 12px;margin-bottom:8px;font-size:12.5px;color:var(--red);display:flex;align-items:center;gap:8px}

/* Info box */
.info-box{background:var(--teal-bg);border:1px solid rgba(57,125,118,.12);border-radius:var(--radius);padding:8px 12px;margin-bottom:10px;font-size:12px;color:var(--teal);display:flex;align-items:flex-start;gap:8px}

/* Next-step box */
.next-box{padding:10px 0;border-bottom:1px solid var(--border2)}
.next-box:last-child{border-bottom:none}

/* Chip */
.chip{display:inline-flex;align-items:center;padding:5px 12px;border:1px solid var(--border);border-radius:16px;font-size:12px;cursor:pointer;color:var(--text2);background:var(--card);transition:all .15s}
.chip:hover{border-color:var(--teal);color:var(--teal)}
.chip.active{background:var(--teal-bg);border-color:var(--teal);color:var(--teal);font-weight:500}

/* Separator */
.sep{height:1px;background:var(--border2);margin:12px 0}

/* Timeline */
.timeline{border-left:2px solid var(--border);padding-left:16px;margin-left:6px}
.tl-item{padding:6px 0;font-size:12.5px;position:relative}
.tl-item::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--teal);position:absolute;left:-21px;top:10px}
.tl-date{font-weight:600;color:var(--text);margin-right:6px}
.tl-item.cut{border-top:1px dashed var(--amber);margin-top:8px;padding-top:10px;color:var(--amber);font-size:11.5px;font-style:italic}
.tl-item.cut::before{background:var(--amber)}

/* Progress */
.progress-bar{height:6px;background:var(--border2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}

/* Empty state */
.empty-state{text-align:center;padding:32px;color:var(--text3);font-size:13px}
.empty-state svg{margin-bottom:6px;opacity:.4}

/* Modal */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
#modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:8px;width:90%;max-width:560px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.modal-body{padding:16px 20px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border)}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--sidebar-bg);color:#fff;padding:10px 20px;border-radius:var(--radius);font-size:12.5px;z-index:200;transition:transform .3s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
#toast.show{transform:translateX(-50%) translateY(0)}

/* Scenario guide steps */
.guide-step{padding:10px 12px;border-left:3px solid var(--border);margin-bottom:6px;border-radius:0 var(--radius) var(--radius) 0;background:var(--card);cursor:pointer;transition:all .15s}
.guide-step:hover{border-left-color:var(--teal);background:var(--teal-bg)}
.guide-step.active{border-left-color:var(--teal);background:var(--teal-bg)}
.guide-step-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--card2);font-size:10px;font-weight:600;color:var(--text3);margin-right:6px}
.guide-step.active .guide-step-num{background:var(--teal);color:#fff}

/* Intervention row */
.intervention-row{padding:8px 12px;background:var(--card2);border-radius:var(--radius);margin-bottom:6px;font-size:12.5px}

/* Responsive */
@media(max-width:1024px){.sidebar{width:60px}.sb-logo-text,.sb-item span,.sb-search,.sb-user-info,.sb-item .badge,.sb-bottom .sb-item span{display:none}.sb-logo{padding:16px 12px;justify-content:center}.sb-item{justify-content:center;padding:10px}.stat-row{grid-template-columns:repeat(3,1fr)}.grid-23,.grid-32{grid-template-columns:1fr}.topbar-logo{display:none}.topbar-divider{display:none}}
@media(max-width:768px){.sidebar{display:none}.stat-row{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-23,.grid-32,.grid-4{grid-template-columns:1fr}.queue-row{grid-template-columns:30px 1fr 1fr .6fr .5fr;font-size:11.5px}.queue-row>div:nth-child(6),.queue-row>div:nth-child(7){display:none}.member-header{flex-direction:column}.member-actions{flex-wrap:wrap}}
</style>
</head>

<div id="toast"></div>

// ===== HELPERS =====
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function statusBadge(s){const m={ok:'badge-green',fresh:'badge-green',gap:'badge-amber',delayed:'badge-amber',conflict:'badge-red',stale:'badge-red',missing:'badge-red',conflicting:'badge-amber',unverified:'badge-amber',matched:'badge-green'};
const l={ok:'Matches',fresh:'Fresh',gap:'Possible gap',delayed:'Delayed',conflict:'Sources disagree',stale:'Stale',missing:'Missing',conflicting:'Conflicting',unverified:'Unverified',matched:'Matched'};
return '<span class="badge '+(m[s]||'badge-gray')+'">'+(l[s]||s)+'</span>'}
function confBadge(c){return '<span class="badge '+(c==='High'?'badge-green':c==='Medium'?'badge-amber':'badge-red')+'">'+c+' confidence</span>'}
function dotStatus(s){return '<span class="dot dot-'+(s==='fresh'||s==='ok'||s==='matched'?'green':s==='delayed'||s==='gap'||s==='conflicting'?'amber':'red')+'"></span>'}
function caseStatusBadge(s){const c={New:'badge-teal','Outreach Due':'badge-red','In Progress':'badge-blue','Awaiting Member':'badge-amber','Awaiting Provider':'badge-amber',Monitoring:'badge-green','Ready for Closure':'badge-teal',Closed:'badge-gray'};
return '<span class="badge '+(c[s]||'badge-gray')+'">'+s+'</span>'}
function rankClass(i){return i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-default'}
function getPatient(idx){return ALL[idx]}
function findPatientIdx(id){return ALL.findIndex(p=>p.id===id)}
function detailedIdx(p){return P.findIndex(x=>x.id===p.id)}
function getCaseStatus(p){return S.caseStatuses[p.id]||p.caseStatus}
function stageFromStatus(s){const m={'New':0,'Outreach Due':1,'In Progress':2,'Awaiting Member':2,'Awaiting Provider':3,'Monitoring':4,'Ready for Closure':5,'Closed':5};return m[s]!==undefined?m[s]:1}

}).join('')+'</div>'+
'<div class="card" style="margin-top:16px"><div class="card-title">'+ic('info',14)+' How the score works</div>'+
'<p style="font-size:12px;color:var(--text3)">Score = Clock (up to 35) + Fresh event (up to 20) + Medicine/care gap (up to 20) + Plan risk × 0.15 (up to 15) + Hard to reach (up to 10). The weights are starting values to tune with nurses during the pilot.</p></div>';
}

// ===== PAGE: MEMBER 360 =====
function renderMember360(){
const p=ALL[S.selIdx];if(!p)return '<div class="empty-state">Select a member</div>';
const tabs=['overview','timeline','clinical','medications','contacts','social','appointments','careplan','assessments','notes','authorizations'];
const tabLabels=['Overview','Timeline','Clinical','Medications','Contacts','Social Needs','Appointments','Care Plan','Assessments','Notes','Authorizations'];
return '<div style="margin-bottom:10px"><button class="btn btn-ghost btn-sm" onclick="nav(\'queue\')">'+ic('chevron-left',13)+' Back to queue</button></div>'+
renderMemberHeader(p)+
(p.fl&&p.fl.length?p.fl.map(f=>'<div class="flag-box">'+ic('alert-triangle',14)+' '+f+'</div>').join(''):'')+
'<div class="tab-bar">'+tabs.map((t,i)=>'<div class="tab'+(S.memberTab===t?' active':'')+'" onclick="setMemberTab(\''+t+'\')">'+tabLabels[i]+'</div>').join('')+'</div>'+
renderMemberTab(p);
}

function renderMemberHeader(p){
return '<div class="member-header"><div class="member-avatar">'+p.name.charAt(0)+'</div><div class="member-info"><div class="member-name">'+p.name+', '+p.age+'</div>'+
'<div class="member-meta"><span>'+ic('hash',11)+' '+p.id+'</span><span>'+ic('shield',11)+' '+(p.planFull||PLANS[p.plan]||p.plan)+'</span><span>'+ic('flag',11)+' '+p.lang+'</span>'+(p.pcp?'<span>'+ic('user',11)+' PCP: '+p.pcp+'</span>':'')+'<span>'+ic('target',11)+' Risk: '+p.risk[0]+'/100 ('+p.risk[1]+')</span></div>'+
'<div style="margin-top:5px">'+caseStatusBadge(getCaseStatus(p))+'</div></div>'+
'<div class="member-actions"><button class="btn btn-primary btn-sm" onclick="nav(\'outreach\')">'+ic('phone',13)+' Prepare outreach</button>'+
'<button class="btn btn-outline btn-sm" onclick="addTaskFor(\''+esc(p.id)+'\',\''+esc(p.name)+'\')">'+ic('plus',13)+' Add task</button>'+
'<button class="btn btn-outline btn-sm" onclick="addNoteFor(\''+esc(p.id)+'\',\''+esc(p.name)+'\')">'+ic('edit',13)+' Add note</button></div></div>';
}

function renderMemberTab(p){
switch(S.memberTab){
case 'overview':return renderOverview(p);case 'timeline':return renderTimeline(p);case 'clinical':return renderClinical(p);
case 'medications':return renderMedications(p);case 'contacts':return renderContacts(p);case 'social':return renderSocial(p);
case 'appointments':return renderAppointments(p);case 'careplan':return renderCarePlan(p);case 'assessments':return renderAssessments(p);
case 'notes':return renderNotes(p);case 'authorizations':return renderAuthorizations(p);default:return renderOverview(p);
}}

function renderOverview(p){
const hasConflicts=p.med&&p.med.some(m=>m.status==='conflict');
const hasGaps=p.med&&p.med.some(m=>m.status==='gap');
return '<div class="grid-23"><div>'+
'<div class="card"><div class="card-title">'+ic('zap',14)+' Suggested next steps</div>'+
(p.act||[]).map((a,i)=>'<div class="next-box"><b>'+(i+1)+'. '+a.t+'</b><div style="font-size:12px;color:var(--text2);margin-top:2px">Why: '+a.w+'</div><div style="margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="source-tag">'+ic('database',10)+' '+a.s+'</span>'+confBadge(a.c)+'</div></div>').join('')+'</div>'+
'<div class="card" style="margin-top:16px"><div class="card-title">'+ic('eye',14)+' Current situation</div>'+
'<div class="section-title">What we know</div><div style="font-size:12.5px;color:var(--text2);line-height:1.7">'+
(p.dx&&p.dx.length?'<div>• Diagnoses: '+p.dx.join(', ')+'</div>':'')+
(p.med&&p.med.length?'<div>• '+p.med.length+' medications on record'+(hasConflicts?' (sources disagree on some)':'')+(hasGaps?' (possible gaps identified)':'')+'</div>':'')+
(p.con&&p.con.length?'<div>• '+p.con.length+' contact number'+(p.con.length>1?'s':'')+' on file</div>':'')+
(p.goals&&p.goals.length?'<div>• '+p.goals.length+' active care plan goal'+(p.goals.length>1?'s':'')+'</div>':'')+
'</div><div class="section-title">What requires attention</div><div style="font-size:12.5px;color:var(--text2);line-height:1.7">'+
(hasConflicts?'<div>• Medication sources disagree — review needed</div>':'')+
(hasGaps?'<div>• Possible medication gap detected</div>':'')+
(p.clk[1]>=30?'<div>• Contact is '+p.clk[0].toLowerCase()+'</div>':'')+
(p.barriers&&p.barriers.length?p.barriers.map(b=>'<div>• '+b.text+'</div>').join(''):'')+
'</div><div class="section-title">What we do not know</div><div style="font-size:12.5px;color:var(--text3);line-height:1.7">'+
'<div>• Claims complete through limited date — recent care may not yet be billed</div>'+
(p.med&&p.med.some(m=>m.status==='gap')?'<div>• Cash pharmacy fills are not visible in plan data</div>':'')+
(p.sdoh&&p.sdoh.some(s=>s.needsReassess)?'<div>• Some social information needs reassessment with member</div>':'')+
'</div></div></div>'+

'<div><div class="card"><div class="card-title">'+ic('activity',14)+' Case lifecycle</div>'+renderLifecycle(p)+'</div>'+
'<div class="card" style="margin-top:16px"><div class="card-title">'+ic('clock',14)+' Score breakdown</div>'+renderScoreBreakdown(p)+'</div>'+
(p.fl&&p.fl.length?'<div class="card" style="margin-top:16px"><div class="card-title">'+ic('shield',14)+' Privacy & consent</div>'+p.fl.map(f=>'<div class="flag-box" style="margin-bottom:4px">'+ic('alert-triangle',13)+' '+f+'</div>').join('')+'</div>':'')+
'</div></div>';
}

function renderLifecycle(p){
const stage=stageFromStatus(getCaseStatus(p));
return '<div class="lifecycle-track">'+CASE_STAGES.map((s,i)=>'<div class="lc-step'+(i<stage?' done':'')+(i===stage?' current':'')+'"><div class="lc-dot"></div><div class="lc-step-label">'+s+'</div></div>').join('')+'</div>';
}

function renderScoreBreakdown(p){
const rk=Math.round(p.risk[0]*0.15);
const parts=[{l:'Clock',v:p.clk[1],max:35,c:COLORS.c1},{l:'Fresh event',v:p.ev,max:20,c:COLORS.c2},{l:'Med/care gap',v:p.gap,max:20,c:COLORS.c3},{l:'Plan risk',v:rk,max:15,c:COLORS.c4},{l:'Hard to reach',v:p.rch,max:10,c:COLORS.c5}];
return '<div style="text-align:center;margin:8px 0"><span class="priority-score" style="font-size:28px">'+p.sc+'</span><span style="color:var(--text3);font-size:12px"> / 100</span></div>'+
'<div class="score-bar" style="height:8px;margin:10px 0">'+parts.map(x=>'<i style="width:'+x.v+'%;background:'+x.c+'"></i>').join('')+'</div>'+
parts.filter(x=>x.v).map(x=>'<div class="data-row" style="font-size:12px"><div><span class="dot" style="background:'+x.c+'"></span> '+x.l+'</div><b>'+x.v+' / '+x.max+'</b></div>').join('');
}

function renderTimeline(p){
if(!p.tl||!p.tl.length)return '<div class="card"><div class="empty-state">'+ic('clock',20)+'<div>No timeline events for queue-only records</div></div></div>';
return '<div class="card"><div class="card-title">'+ic('clock',14)+' Event timeline</div>'+
'<p style="font-size:12px;color:var(--text3);margin-bottom:8px">Events from hospital alerts, claims and visits. The dashed line shows where billing data stops.</p>'+
'<div class="timeline">'+p.tl.map(t=>'<div class="tl-item"><span class="tl-date">'+t[0]+'</span> '+t[1]+'</div>').join('')+
(p.cut?'<div class="tl-item cut">'+p.cut+'</div>':'')+'</div></div>';
}

function renderClinical(p){
return '<div class="grid-2"><div class="card"><div class="card-title">'+ic('file-text',14)+' Diagnoses on record</div>'+
(p.dx&&p.dx.length?'<ul style="padding-left:18px;font-size:12.5px">'+p.dx.map(d=>'<li style="margin-bottom:4px">'+d+'</li>').join('')+'</ul>':'<div class="empty-state" style="padding:12px">No diagnoses recorded</div>')+
'<p class="source-tag" style="margin-top:8px">'+ic('info',10)+' Source: claims and alerts. Not a clinical assessment.</p></div>'+
'<div class="card"><div class="card-title">'+ic('activity',14)+' Risk profile</div>'+
'<div class="data-row"><div>Plan risk score</div><b>'+p.risk[0]+' / 100</b></div>'+
'<div class="data-row"><div>Score date</div><b>'+p.risk[1]+'</b></div>'+
'<div class="data-row"><div>Priority score</div><b>'+p.sc+' / 100</b></div>'+
'<div class="data-row"><div>Case status</div>'+caseStatusBadge(getCaseStatus(p))+'</div></div></div>';
}

function renderMedications(p){
if(!p.med||!p.med.length)return '<div class="card"><div class="empty-state">'+ic('info',20)+'<div>Very little pharmacy data available. No adherence score is shown.</div></div></div>';
return '<div class="card"><div class="card-title">'+ic('activity',14)+' Medication reconciliation</div>'+
'<p style="font-size:12px;color:var(--text3);margin-bottom:10px">Two sources side by side. Cash fills are not visible. Nothing is recorded until you confirm.</p>'+
'<div class="table-wrap"><table><thead><tr><th>Medication</th><th>Source A</th><th>Source B</th><th>Status</th><th>Action</th></tr></thead><tbody>'+
p.med.map(m=>'<tr><td><b>'+m.name+'</b><br><span style="color:var(--text3);font-size:11px">'+m.freq+'</span></td><td>'+m.srcA+'</td><td>'+m.srcB+'</td><td>'+statusBadge(m.status)+'</td><td>'+(m.status!=='ok'?'<button class="btn btn-outline btn-sm" onclick="resolveMed(\''+esc(p.id)+'\',\''+esc(m.name)+'\')">Review</button>':'<span style="color:var(--green)">'+ic('check',13)+'</span>')+'</td></tr>').join('')+
'</tbody></table></div></div>';
}

function renderContacts(p){
if(!p.con||!p.con.length)return '<div class="card"><div class="empty-state">No contact records available</div></div>';
return '<div class="card"><div class="card-title">'+ic('phone',14)+' Contact intelligence</div>'+
'<div class="table-wrap"><table><thead><tr><th>Number</th><th>Owner & source</th><th>Last checked</th><th>Status</th><th>Permission</th></tr></thead><tbody>'+
p.con.map(c=>{const stCls=(/not in service|do not|no permission|unanswered|disconnected/i.test(c.status))?'badge-red':(/working|permission on file|try first|consent yes/i.test(c.status))?'badge-green':'badge-amber';
return '<tr><td><b>'+c.num+'</b></td><td>'+c.who+'</td><td>'+c.checked+'</td><td><span class="badge '+stCls+'">'+c.status+'</span></td><td>'+(c.perm?'<span class="badge badge-green">Authorized</span>':'<span class="badge badge-red">Restricted</span>')+'</td></tr>'}).join('')+
'</tbody></table></div>'+
(p.note?'<div style="margin-top:12px;padding:10px;background:var(--card2);border-radius:var(--radius);font-size:12px;color:var(--text2)"><b>Previous note:</b> '+p.note+'</div>':'')+'</div>';
}

function renderSocial(p){
if(!p.sdoh||!p.sdoh.length)return '<div class="card"><div class="empty-state">No social determinants data available for this member</div></div>';
return '<div class="card"><div class="card-title">'+ic('home',14)+' Social determinants of health</div>'+
'<p style="font-size:12px;color:var(--text3);margin-bottom:10px">Every item shows its source and age. Stale information should be reassessed with the member.</p>'+
'<div class="table-wrap"><table><thead><tr><th>Factor</th><th>Reported value</th><th>Source</th><th>Age</th><th>Status</th></tr></thead><tbody>'+
p.sdoh.map(s=>'<tr><td><b>'+s.item+'</b></td><td>'+s.value+'</td><td><span class="source-tag">'+s.source+'</span></td><td>'+s.age+'</td><td>'+(s.needsReassess?'<span class="badge badge-amber">Reassess</span>':'<span class="badge badge-green">Current</span>')+'</td></tr>').join('')+
'</tbody></table></div></div>';
}

function renderAppointments(p){
return '<div class="card"><div class="card-title">'+ic('calendar',14)+' Appointments</div>'+
'<div class="info-box">'+ic('info',14)+' Appointment feed last refreshed 5–6 Nov. Recent scheduling changes may not appear.</div>'+
(p.pcp?'<div class="data-row"><div>Primary care provider</div><b>'+p.pcp+'</b></div>':'')+
'<div class="data-row"><div>Upcoming appointments</div><span class="badge badge-amber">No appointment found in the available feed</span></div>'+
'<div style="margin-top:12px"><button class="btn btn-outline btn-sm" onclick="addTaskFor(\''+esc(p.id)+'\',\''+esc(p.name)+'\')">'+ic('plus',13)+' Create appointment task</button></div></div>';
}

// ===== CARE PLAN (with interventions) =====
function renderCarePlan(p){
if(p.isLight)return '<div class="card"><div class="empty-state">Care plan details available only for detailed patient records</div></div>';
if(!p.goals||!p.goals.length)return '<div class="card"><div class="card-title">'+ic('heart',14)+' Care plan</div><div class="empty-state" style="padding:20px">'+ic('heart',20)+'<div>No care plan created yet</div><button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="addGoalFor(\''+esc(p.id)+'\')">'+ic('plus',13)+' Create care plan</button></div></div>';
const carePlanChanges=S.carePlan[p.id]||{};
const interventions=S.interventions[p.id]||[];
return '<div class="card"><div class="card-title">'+ic('heart',14)+' Goals</div>'+
p.goals.map((g,i)=>{const st=carePlanChanges['goal_'+i]||g.status;
return '<div style="padding:8px 0;border-bottom:1px solid var(--border2)"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:12.5px">'+g.text+'</b><select class="form-select" style="width:auto;font-size:11px;padding:3px 6px" onchange="updateGoal(\''+esc(p.id)+'\','+i+',this.value)"><option'+(st==='Not started'?' selected':'')+'>Not started</option><option'+(st==='In progress'?' selected':'')+'>In progress</option><option'+(st==='Completed'?' selected':'')+'>Completed</option></select></div><div style="font-size:11.5px;color:var(--text3);margin-top:2px">Target: '+g.target+'</div></div>'}).join('')+'</div>'+

(p.barriers&&p.barriers.length?'<div class="card" style="margin-top:16px"><div class="card-title">'+ic('alert-triangle',14)+' Barriers</div>'+
p.barriers.map(b=>'<div style="padding:6px 0;border-bottom:1px solid var(--border2)"><b style="font-size:12.5px">'+b.text+'</b><div style="font-size:11.5px;color:var(--text3)">Evidence: '+b.evidence+'</div><div style="margin-top:3px">'+(b.confirmed?'<span class="badge badge-red">Confirmed</span>':'<span class="badge badge-amber">Needs confirmation</span>')+'</div></div>').join('')+'</div>':'')+

'<div class="card" style="margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:center"><div class="card-title" style="margin-bottom:0">'+ic('check-square',14)+' Interventions</div><button class="btn btn-primary btn-sm" onclick="addIntervention(\''+esc(p.id)+'\',\''+esc(p.name)+'\')">'+ic('plus',12)+' Add</button></div>'+
(interventions.length?interventions.map((iv,i)=>'<div class="intervention-row" style="margin-top:8px"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><b>'+iv.activity+'</b><div style="font-size:11.5px;color:var(--text3)">'+iv.responsible+' · Due: '+iv.deadline+'</div>'+(iv.outcome?'<div style="font-size:11.5px;color:var(--green);margin-top:2px">Outcome: '+iv.outcome+'</div>':'')+'</div><div style="display:flex;gap:4px"><select class="form-select" style="width:auto;font-size:11px;padding:2px 4px" onchange="updateInterventionStatus(\''+esc(p.id)+'\','+i+',this.value)"><option'+(iv.status==='Planned'?' selected':'')+'>Planned</option><option'+(iv.status==='In progress'?' selected':'')+'>In progress</option><option'+(iv.status==='Completed'?' selected':'')+'>Completed</option><option'+(iv.status==='Cancelled'?' selected':'')+'>Cancelled</option></select></div></div></div>').join(''):'<div style="padding:12px 0;font-size:12px;color:var(--text3)">No interventions recorded yet. Add one to track planned activities.</div>')+'</div>';
}

// ===== ASSESSMENTS (editable) =====
function renderAssessments(p){
if(p.isLight)return '<div class="card"><div class="empty-state">Full assessment details not available for queue-only records. Open a detailed patient record to complete assessments.</div></div>';
const saved=S.assessments[p.id]||{};
const sections=[
{title:'Clinical',icon:'activity',fields:[
{key:'clinical_hosp',label:'Recent hospitalization',val:p.tl&&p.tl.length?p.tl[p.tl.length-1][1]:'None on record',source:'Timeline'},
{key:'clinical_dx',label:'Current conditions',val:p.dx?p.dx.join(', '):'None recorded',source:'Claims/alerts'},
{key:'clinical_med',label:'Medication review needed',val:p.med&&p.med.some(m=>m.status!=='ok')?'Yes — discrepancies found':'No issues identified',source:'Pharmacy + discharge'}]},
{title:'Functional',icon:'user',fields:[
{key:'func_mobility',label:'Mobility',val:'Not assessed',source:'Needs assessment'},
{key:'func_adl',label:'Activities of daily living',val:'Not assessed',source:'Needs assessment'}]},
{title:'Behavioral health',icon:'heart',fields:[
{key:'bh_screen',label:'Behavioral health screen',val:p.dx&&p.dx.some(d=>/depress|psych|bipolar|anxiety/i.test(d))?'Condition on record — needs follow-up':'Not indicated',source:'Claims'},
{key:'bh_substance',label:'Substance use',val:'Not assessed',source:'Needs assessment'}]},
{title:'Social needs',icon:'home',fields:p.sdoh&&p.sdoh.length?p.sdoh.map(s=>({key:'social_'+s.item.toLowerCase().replace(/\s/g,'_'),label:s.item,val:s.value,source:s.source})):[{key:'social_none',label:'Social determinants',val:'No data available',source:'Needs assessment'}]},
{title:'Medication & access',icon:'shield',fields:[
{key:'med_access',label:'Medication access barriers',val:p.barriers&&p.barriers.some(b=>/cost|copay|fill|med/i.test(b.text))?'Possible barriers identified':'None identified',source:'Pharmacy/member services'},
{key:'med_adherence',label:'Adherence concerns',val:p.med&&p.med.some(m=>m.status==='gap')?'Gap detected — confirm with member':'No gaps detected',source:'Pharmacy data'}]},
{title:'Goals & readiness',icon:'target',fields:[
{key:'goals_identified',label:'Member goals identified',val:p.goals&&p.goals.length?p.goals.length+' goals on care plan':'Not yet assessed',source:'Care plan'},
{key:'goals_readiness',label:'Readiness for change',val:'Not assessed',source:'Needs assessment'}]}
];
const total=sections.reduce((a,s)=>a+s.fields.length,0);
const confirmed=sections.reduce((a,s)=>a+s.fields.filter(f=>saved[f.key]).length,0);
return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div class="card-title" style="margin-bottom:0">'+ic('clipboard',14)+' Assessment — '+p.name+'</div><div style="display:flex;align-items:center;gap:10px"><div class="progress-bar" style="width:100px"><div class="progress-fill" style="width:'+Math.round(confirmed/Math.max(total,1)*100)+'%;background:var(--green)"></div></div><span style="font-size:11px;color:var(--text3)">'+confirmed+'/'+total+' reviewed</span></div></div>'+
sections.map(sec=>'<div class="section-title">'+ic(sec.icon,12)+' '+sec.title+'</div>'+
sec.fields.map(f=>{const isConfirmed=saved[f.key];const editedVal=saved[f.key+'_val'];
return '<div style="padding:7px 0;border-bottom:1px solid var(--border2)"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="flex:1"><b style="font-size:12.5px">'+f.label+'</b><div style="font-size:12px;color:var(--text2);margin-top:1px">'+(editedVal||f.val)+'</div><span class="source-tag" style="margin-top:2px">'+f.source+'</span></div><div style="display:flex;gap:4px;align-items:center">'+
(isConfirmed?'<span class="badge badge-green">'+ic('check',10)+' Reviewed</span>':'<button class="btn btn-outline btn-sm" onclick="editAssessmentField(\''+esc(p.id)+'\',\''+esc(f.key)+'\',\''+esc(f.label)+'\',\''+esc(editedVal||f.val)+'\')">Edit</button><button class="btn btn-primary btn-sm" onclick="confirmAssessment(\''+esc(p.id)+'\',\''+esc(f.key)+'\')">Confirm</button>')+
'</div></div></div>'}).join('')).join('')+'</div>';
}

function renderNotes(p){
const notes=S.notes[p.id]||[];
return '<div class="card"><div class="card-title">'+ic('file-text',14)+' Case notes</div>'+
'<button class="btn btn-primary btn-sm" onclick="addNoteFor(\''+esc(p.id)+'\',\''+esc(p.name)+'\')">'+ic('plus',13)+' Add note</button>'+
(p.note?'<div style="margin-top:12px;padding:10px;background:var(--card2);border-radius:var(--radius)"><span class="badge badge-gray">Historical</span><div style="margin-top:4px;font-size:12px">'+p.note+'</div></div>':'')+
(notes.length?notes.map(n=>'<div style="margin-top:8px;padding:10px;background:var(--card2);border-radius:var(--radius)"><div style="display:flex;justify-content:space-between"><span class="badge badge-teal">'+n.type+'</span><span style="font-size:11px;color:var(--text3)">'+n.date+'</span></div><div style="margin-top:4px;font-size:12px">'+n.text+'</div></div>').join(''):'')+'</div>';

function renderAuthorizations(p){
if(!p.auths||!p.auths.length)return '<div class="card"><div class="card-title">'+ic('shield',14)+' Prior authorizations</div><div class="empty-state" style="padding:16px">No authorization requests on file</div></div>';
return '<div class="card"><div class="card-title">'+ic('shield',14)+' Prior authorizations</div>'+
'<div class="table-wrap"><table><thead><tr><th>Service</th><th>Status</th><th>Requested</th><th>Deadline</th><th>Notes</th></tr></thead><tbody>'+
p.auths.map(a=>'<tr><td><b>'+a.service+'</b></td><td><span class="badge '+(a.status==='Approved'?'badge-green':a.status==='Denied'?'badge-red':'badge-amber')+'">'+a.status+'</span></td><td>'+a.requested+'</td><td>'+a.deadline+'</td><td>'+a.notes+'</td></tr>').join('')+
'</tbody></table></div></div>';

// ===== PAGE: OUTREACH (with system-generated note drafting) =====
function renderOutreach(){
const p=ALL[S.selIdx];if(!p||p.isLight)return '<div class="card"><div class="card-title">Outreach</div><p style="color:var(--text3)">Select a detailed patient from the queue to prepare outreach.</p><div style="margin-top:12px">'+P.map((pt,i)=>'<button class="btn btn-outline btn-sm" style="margin:4px" onclick="openMemberForOutreach('+findPatientIdx(pt.id)+')">'+pt.name+' — '+pt.tag+'</button>').join('')+'</div></div>';

// ===== PAGE: TASKS (enhanced) =====
function renderTasks(){
const views=[{id:'all',label:'All'},{id:'today',label:'Due today'},{id:'overdue',label:'Overdue'},{id:'waiting',label:'Waiting'},{id:'completed',label:'Completed'}];
let tasks=[...S.tasks];const view=S.taskView||'all';
if(view==='today')tasks=tasks.filter(t=>t.due==='9 Nov'&&t.status!=='Completed');
else if(view==='overdue')tasks=tasks.filter(t=>{const d=parseInt(t.due);return d<9&&t.due.includes('Nov')&&t.status!=='Completed'});
else if(view==='waiting')tasks=tasks.filter(t=>t.status.startsWith('Waiting'));
else if(view==='completed')tasks=tasks.filter(t=>t.status==='Completed');
else tasks=tasks.filter(t=>t.status!=='Completed'&&t.status!=='Cancelled');

return '<div class="page-header"><h1>Tasks & Follow-ups</h1><p>'+S.tasks.filter(t=>t.status!=='Completed'&&t.status!=='Cancelled').length+' pending tasks</p></div>'+
'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="tab-bar" style="margin-bottom:0">'+views.map(v=>'<div class="tab'+(view===v.id?' active':'')+'" onclick="setTaskView(\''+v.id+'\')">'+v.label+'</div>').join('')+'</div>'+
'<button class="btn btn-primary btn-sm" onclick="openNewTask()">'+ic('plus',13)+' New task</button></div>'+
'<div class="table-wrap"><table><thead><tr><th>Task</th><th>Member</th><th>Category</th><th>Priority</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+
(tasks.length?tasks.map(t=>'<tr><td><b style="font-size:12px">'+t.title+'</b>'+(t.notes?'<div style="font-size:11px;color:var(--text3)">'+t.notes+'</div>':'')+'</td><td><a style="color:var(--teal);cursor:pointer;text-decoration:none" onclick="openMember('+findPatientIdx(t.memberId)+')">'+t.member+'</a></td><td><span class="source-tag">'+t.cat+'</span></td><td><span class="badge '+(t.priority==='High'?'badge-red':'badge-amber')+'">'+t.priority+'</span></td><td>'+t.due+'</td><td><select class="form-select" style="width:auto;font-size:11px;padding:2px 4px" onchange="updateTaskStatus('+t.id+',this.value)"><option'+(t.status==='Not started'?' selected':'')+'>Not started</option><option'+(t.status==='In progress'?' selected':'')+'>In progress</option><option'+(t.status==='Waiting on member'?' selected':'')+'>Waiting on member</option><option'+(t.status==='Waiting on provider'?' selected':'')+'>Waiting on provider</option><option'+(t.status==='Completed'?' selected':'')+'>Completed</option></select></td><td><div style="display:flex;gap:4px"><button class="btn btn-outline btn-sm" onclick="editTask('+t.id+')" title="Edit">'+ic('edit',11)+'</button><button class="btn btn-outline btn-sm" onclick="snoozeTask('+t.id+')" title="Snooze">'+ic('clock',11)+'</button>'+(t.status!=='Completed'?'<button class="btn btn-success btn-sm" onclick="completeTask('+t.id+')" title="Complete">'+ic('check',11)+'</button>':'')+'</div></td></tr>').join(''):'<tr><td colspan="7"><div class="empty-state" style="padding:16px">No tasks in this view</div></td></tr>')+
'</tbody></table></div>';
}

// ===== PAGE: CASE LIFECYCLE (with closure checklist) =====
function renderLifecyclePage(){
return '<div class="page-header"><h1>Case Lifecycle</h1><p>Track cases from identification through closure</p></div>'+
P.map(p=>{
const currentStatus=getCaseStatus(p);
const pendingGoals=p.goals?p.goals.filter(g=>(S.carePlan[p.id]||{})['goal_'+p.goals.indexOf(g)]!=='Completed'&&g.status!=='Completed').length:0;
const pendingTasks=S.tasks.filter(t=>t.memberId===p.id&&t.status!=='Completed'&&t.status!=='Cancelled').length;
const pendingCoord=S.coordination.filter(c=>c.memberId===p.id&&c.status!=='Completed'&&c.status!=='Cancelled').length;

return '<div class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="card-title" style="margin-bottom:0">'+p.name+', '+p.age+' — '+p.id+'</div><span style="font-size:12px;color:var(--text3)">'+p.tag+'</span></div><div style="display:flex;align-items:center;gap:8px">'+caseStatusBadge(currentStatus)+

['New','Outreach Due','In Progress','Awaiting Member','Awaiting Provider','Monitoring','Ready for Closure','Closed'].map(s=>'<option'+(s===currentStatus?' selected':'')+'>'+s+'</option>').join('')+'</select></div></div>'+
renderLifecycle(p)+
(isClosureReady?'<div style="margin-top:12px;padding:12px;background:var(--card2);border-radius:var(--radius)"><div class="section-title" style="margin-top:0">Closure checklist</div>'+
'<div class="data-row"><div>Outstanding goals</div>'+(pendingGoals===0?'<span class="badge badge-green">'+ic('check',10)+' All completed</span>':'<span class="badge badge-amber">'+pendingGoals+' remaining</span>')+'</div>'+

function generateCallNote(id){
const p=ALL.find(x=>x.id===id);if(!p)return;
const outcome=S.outreachOutcome||'(not yet selected)';
const channel=S.outreachChannel||'Phone call';
const note=S.outreachNote||document.getElementById('outreach-note')?.value||'';
let draft='[System-generated draft — review and edit before saving]\n\n';
draft+='Date: 9 Nov 2026 | Channel: '+channel+' | Outcome: '+outcome+'\n';
draft+='Member: '+p.name+', '+p.age+' ('+p.id+')\n\n';

draft+='\n[Reviewed by: Maria, RN — Confirmed: pending]';
openModal('<div class="modal-header"><h3>'+ic('file-text',16)+' System-generated call note draft</h3><button class="btn btn-ghost" onclick="closeModal()">'+ic('x',16)+'</button></div>'+

function saveNewTaskGeneral(){
const title=document.getElementById('task-title')?.value;
if(!title){showToast('Please enter a task description');return}
const memberVal=(document.getElementById('task-member')?.value||'').split('|');
const newId=Math.max(...S.tasks.map(t=>t.id),0)+1;
S.tasks.push({id:newId,title:title,member:memberVal[1]||'',memberId:memberVal[0]||'',
cat:document.getElementById('task-cat')?.value||'Case review',
priority:document.getElementById('task-priority')?.value||'Medium',
owner:'Maria',due:document.getElementById('task-due')?.value||'11 Nov',
status:'Not started',source:'Manual entry',notes:'',history:[]});
closeModal();saveState();render();showToast('Task created')}

function addIntervention(id,name){
openModal('<div class="modal-header"><h3>Add intervention — '+name+'</h3><button class="btn btn-ghost" onclick="closeModal()">'+ic('x',16)+'</button></div>'+
'<div class="modal-body"><div class="form-group"><label class="form-label">Planned activity</label><input type="text" class="form-input" id="iv-activity" placeholder="What needs to be done..."></div>'+
'<div class="form-group"><label class="form-label">Responsible person</label><input type="text" class="form-input" id="iv-responsible" value="Maria, RN"></div>'+
'<div class="form-group"><label class="form-label">Deadline</label><input type="text" class="form-input" id="iv-deadline" placeholder="e.g., 12 Nov"></div>'+
'<div class="form-group"><label><input type="checkbox" id="iv-create-task"> Also create a linked task</label></div></div>'+
'<div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveIntervention(\''+esc(id)+'\',\''+esc(name)+'\')">Add intervention</button></div>');
}

function saveIntervention(id,name){
const activity=document.getElementById('iv-activity')?.value;
if(!activity){showToast('Please describe the activity');return}
const responsible=document.getElementById('iv-responsible')?.value||'Maria, RN';
const deadline=document.getElementById('iv-deadline')?.value||'TBD';
const createTask=document.getElementById('iv-create-task')?.checked;
if(!S.interventions[id])S.interventions[id]=[];
S.interventions[id].push({activity:activity,responsible:responsible,deadline:deadline,status:'Planned',outcome:''});
if(createTask){
const newId=Math.max(...S.tasks.map(t=>t.id),0)+1;
S.tasks.push({id:newId,title:activity,member:name,memberId:id,cat:'Other',priority:'Medium',owner:'Maria',due:deadline,status:'Not started',source:'Intervention',notes:'',history:[]})}
closeModal();saveState();render();showToast('Intervention added'+(createTask?' (task created)':''))}

function updateInterventionStatus(id,idx,status){
if(S.interventions[id]&&S.interventions[id][idx]){
S.interventions[id][idx].status=status;
saveState();render();showToast('Intervention updated')}}

function updateCoordStatus(idx,status){
if(S.coordination[idx]){S.coordination[idx].status=status;S.coordination[idx].lastUpdate='9 Nov — '+status;saveState();render();showToast('Coordination status updated')}}

function addCoordNote(idx){
const r=S.coordination[idx];if(!r)return;
openModal('<div class="modal-header"><h3>Update: '+r.service+'</h3><button class="btn btn-ghost" onclick="closeModal()">'+ic('x',16)+'</button></div>'+
'<div class="modal-body"><div class="form-group"><label class="form-label">Update note</label><textarea class="form-textarea" id="coord-note" placeholder="Add coordination note...">'+esc(r.notes)+'</textarea></div>'+
'<div class="form-group"><label class="form-label">Follow-up date</label><input type="text" class="form-input" id="coord-followup" value="'+esc(r.deadline)+'"></div></div>'+
'<div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveCoordNote('+idx+')">Save</button></div>');
}

function saveCoordNote(idx){
S.coordination[idx].notes=document.getElementById('coord-note')?.value||'';
S.coordination[idx].deadline=document.getElementById('coord-followup')?.value||S.coordination[idx].deadline;
S.coordination[idx].lastUpdate='9 Nov — updated';
closeModal();saveState();render();showToast('Coordination record updated')}

function addCoordRecord(){
openModal('<div class="modal-header"><h3>Add coordination record</h3><button class="btn btn-ghost" onclick="closeModal()">'+ic('x',16)+'</button></div>'+
'<div class="modal-body"><div class="form-group"><label class="form-label">Service / Action</label><input type="text" class="form-input" id="coord-service" placeholder="e.g., Cardiology referral"></div>'+
'<div class="form-group"><label class="form-label">Member</label><select class="form-select" id="coord-member">'+P.map(p=>'<option value="'+p.id+'|'+p.name+'">'+p.name+'</option>').join('')+'</select></div>'+
'<div class="form-group"><label class="form-label">Provider</label><input type="text" class="form-input" id="coord-provider" placeholder="Provider name"></div>'+
'<div class="form-group"><label class="form-label">Deadline</label><input type="text" class="form-input" id="coord-deadline" placeholder="e.g., 12 Nov"></div></div>'+
'<div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveNewCoord()">Add record</button></div>');
}

function saveNewCoord(){
const service=document.getElementById('coord-service')?.value;
if(!service){showToast('Please enter a service');return}
const memberVal=(document.getElementById('coord-member')?.value||'').split('|');
const newId=Math.max(...S.coordination.map(c=>c.id),0)+1;
S.coordination.push({id:newId,member:memberVal[1]||'',memberId:memberVal[0]||'',service:service,
provider:document.getElementById('coord-provider')?.value||'TBD',
requested:'9 Nov',deadline:document.getElementById('coord-deadline')?.value||'TBD',
status:'Pending',owner:'Maria',lastUpdate:'9 Nov — created',notes:''});
closeModal();saveState();render();showToast('Coordination record added')}

// ===== RENDER =====
function render(){
const pageContent={today:renderToday,queue:renderQueue,members:renderMembers,member360:renderMember360,outreach:renderOutreach,
assessments:renderAssessmentsPage,careplans:renderCarePlans,tasks:renderTasks,coordination:renderCoordination,
data:renderData,lifecycle:renderLifecyclePage,performance:renderPerformance};
const fn=pageContent[S.page]||renderToday;
document.getElementById('app').innerHTML=renderSidebar()+'<div class="main">'+renderTopbar()+'<div class="content">'+fn()+'</div></div>';
}

render();
</script>
